[package]
name = "rusty-tube"
version = "1.1.0"
edition = "2024"
description = "TUI-загрузчик видео с YouTube для Windows и macOS (yt-dlp + ffmpeg через scoop или Homebrew)"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = { version = "3", default-features = false }
dirs = "6"
ratatui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
